<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="profile-card">
        <img src="https://via.placeholder.com/150"
             alt="Profile Picture" class="profile-img">

        <section>
            <h2>Name</h2>
            <p>Suyash Pokharkar</p>
        </section>

        <section>
            <h2>Email</h2>
            <p>suyash@example.com</p>
        </section>

        <section>
            <h2>Profile</h2>
            <p>Data Analyst</p>
        </section>

        <section>
            <h2>About me</h2>
            <p>
                I am a BCA graduate interested in data analytics,
                programming, and machine learning. I enjoy solving
                problems and learning new technologies.
            </p>
        </section>

        <section>
            <h2>Skills</h2>

            <p>Python</p>
            <div class="skill-bar">
                <div class="progress" style="width: 85%">85%</div>
            </div>

            <p>SQL</p>
            <div class="skill-bar">
                <div class="progress" style="width: 80%">80%</div>
            </div>

            <p>HTML & CSS</p>
            <div class="skill-bar">
                <div class="progress" style="width: 75%">75%</div>
            </div>

            <p>JavaScript</p>
            <div class="skill-bar">
                <div class="progress" style="width: 65%">65%</div>
            </div>
        </section>
    </div>

</body>
</html>
